name: Build ISO
on:
  workflow_dispatch:
jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        
      - name: Build Installer ISO
        uses: jasonn3/build-container-installer@v1.2.2
        with:
          arch: x86_64
          image_name: luminaos
          image_repo: ghcr.io/landers231
          image_tag: latest
          version: 40
          iso_name: luminaos.iso

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminaos-iso
          path: ./*.iso
