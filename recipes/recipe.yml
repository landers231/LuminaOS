name: luminaos
description: Fusión Windows/Mac con IA local y máxima batería
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - tlp
      - tlp-rdw
      - qemu-kvm
      - libvirt
      - freerdp
      - intel-compute-runtime
      - rocm-opencl

  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-title: Flathub (System)
      install:
        - org.onlyoffice.desktopeditors
        - com.spotify.Client
        - com.discordapp.Discord

  - type: systemd
    system:
      enabled:
        - tlp.service
